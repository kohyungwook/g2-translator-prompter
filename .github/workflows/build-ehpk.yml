name: Build EHPK Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Proper Icon
        run: |
          python3 -c "
          import zlib, struct
          def make_png(w, h):
              raw = b''.join(b'\x00' + b'\x1e\x90\xff' * w for _ in range(h))
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data))
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          with open('icon.png', 'wb') as f:
              f.write(make_png(256, 256))
          "

      - name: Build Official EHPK
        run: |
          npm install -g @evenrealities/evenhub-cli
          # EvenHub CLI로 정석 패키징 시도
          evenhub build || evenhub pack || npx @evenrealities/evenhub-cli build || npx @evenrealities/evenhub-cli pack || {
            echo "Direct packing..."
            zip -q -0 -r com.user.g2translator.ehpk evenhub.json package.json index.html icon.png
          }

      - name: Upload EHPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: g2-translator-ehpk
          path: "*.ehpk"

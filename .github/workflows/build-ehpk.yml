name: Build EHPK Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Valid Icon
        run: |
          python3 -c "
          import zlib, struct
          def make_png(w, h):
              raw = b''.join(b'\x00' + b'\x1e\x90\xff' * w for _ in range(h))
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data))
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          with open('icon.png', 'wb') as f:
              f.write(make_png(128, 128))
          "

      - name: Build with EvenHub CLI
        run: |
          npm install -g @evenrealities/evenhub-cli
          npx evenhub-cli pack || npx evenhub-cli build || zip -r package.ehpk index.html evenhub.json package.json icon.png

      - name: Upload EHPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: g2-translator-ehpk
          path: "*.ehpk"
